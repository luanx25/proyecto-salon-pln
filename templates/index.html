<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ config.nombre_salon }}</title>
    <link rel="stylesheet" href="/static/landing.css">
    <style>:root { --color: {{ config.color_principal }}; }</style>
</head>
<body>
<header class="topbar">
    <a class="logo" href="#">{{ config.nombre_salon }}</a>
    <nav>
        {% for s in secciones if s.tipo != 'hero' and s.titulo %}
        <a href="#{{ s.clave }}">{{ s.titulo }}</a>
        {% endfor %}
    </nav>
</header>

{% for s in secciones %}
{% include "secciones/" ~ s.tipo ~ ".html" %}
{% endfor %}

<footer>© {{ config.nombre_salon }}</footer>
</body>
</html>

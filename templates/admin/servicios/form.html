{% extends "admin/base.html" %}
{% block title %}{{ 'Editar' if servicio else 'Nuevo' }} servicio{% endblock %}
{% block content %}
<h1>{{ 'Editar' if servicio else 'Nuevo' }} servicio</h1>

{% for e in errores %}<div class="flash error">{{ e }}</div>{% endfor %}

<form method="post" class="form">
    <label>Nombre
        <input name="nombre" value="{{ datos.nombre }}" required>
        <small>Se guarda en minúsculas; es el nombre que el asistente reconoce en los mensajes.</small>
    </label>
    <label>Duración (minutos)
        <input type="number" name="duracion_min" min="5" max="480" step="5" value="{{ datos.duracion_min }}" required>
    </label>
    <label>Precio
        <input type="number" name="precio" min="0" step="0.01" value="{{ datos.precio }}" required>
    </label>
    <div class="actions">
        <button class="btn" type="submit">Guardar</button>
        <a href="/admin/servicios">Cancelar</a>
    </div>
</form>
{% endblock %}
